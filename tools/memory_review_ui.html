<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>记忆候选审核</title><link rel="stylesheet" href="app.css"><script src="app.js" defer></script></head>
<body><main><header><p class="eyebrow">私人档案 · 人工确认</p><h1>记忆候选审核</h1><p>候选、机器转写和推断都不是已确认事实。请核对来源后逐条选择；无法判断时可暂缓。</p><p>决定仅针对候选或转写文字，不代表原音已核实。提交只保存回执，不会更新正式记忆或开始训练。</p></header><p id="message" role="status" aria-live="polite">正在读取草稿…</p><section id="receipt" hidden></section><form id="review"><nav aria-label="候选翻页"><button id="previous" type="button" disabled>上一项</button><span id="position"></span><button id="next" type="button" disabled>下一项</button></nav><div id="items"></div><footer><p id="progress"></p><button id="save" type="button" disabled>保存草稿</button><button id="submit" type="submit" disabled>最终提交</button><button id="reload" type="button">重新读取已保存状态</button><p>未保存的选择会在刷新后丢失。暂缓项会留在回执中，仍待解决。</p></footer></form></main></body></html>
